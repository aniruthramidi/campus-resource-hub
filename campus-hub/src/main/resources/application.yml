spring:
  application:
    name: campus-hub

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campushubdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:CampusResourceHubJwtSecretKeyForTestEnvironmentsOnly32BytesMinLengthRequirement}
    expiration-ms: 86400000 # 24 hours in milliseconds

# Google Cloud Storage Configuration
gcp:
  storage:
    bucket-name: ${GCP_STORAGE_BUCKET:campus-hub-resources}
    project-id: ${GCP_PROJECT_ID:campus-resource-hub-dev}

server:
  port: 8080
